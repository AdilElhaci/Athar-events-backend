# Managed by Athar Events blue/green deployment.
# Installed by scripts/setup-server.sh. scripts/deploy-production.sh replaces only the two
# included upstream files, validates nginx, then reloads gracefully.
# https://api.atharevents.sa is the public API host (webhooks, health, integrations).
# https://atharevents.sa serves the web app; its /api path reaches the same API so the browser
# stays same-origin and the HttpOnly refresh cookie stays first-party (ADR-0006).
# Either way nginx is the one proxy and adds X-Forwarded-For (TRUST_PROXY_HOPS=1).

upstream athar_events_web {
    include /etc/nginx/athar-events-upstreams/web.conf;
    keepalive 16;
}

upstream athar_events_api {
    include /etc/nginx/athar-events-upstreams/api.conf;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name atharevents.sa;

    ssl_certificate /etc/letsencrypt/live/atharevents.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atharevents.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Guest-list imports are Excel files; the API enforces its own limit.
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://athar_events_api;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://athar_events_web;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.atharevents.sa;

    ssl_certificate /etc/letsencrypt/live/atharevents.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atharevents.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://athar_events_api;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.atharevents.sa;

    ssl_certificate /etc/letsencrypt/live/atharevents.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atharevents.sa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://atharevents.sa$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name atharevents.sa www.atharevents.sa;

    # Certbot's nginx authenticator answers its own challenges during renewal.
    return 301 https://atharevents.sa$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.atharevents.sa;

    return 301 https://api.atharevents.sa$request_uri;
}
