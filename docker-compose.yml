# Local development and test infrastructure only. Ports avoid other local stacks.
name: athar-events

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: athar_events
      POSTGRES_PASSWORD: athar_events_dev
      POSTGRES_DB: athar_events
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athar_events -d athar_events"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Captures every email locally: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
